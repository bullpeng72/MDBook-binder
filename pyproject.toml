[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdbook-binder"
version = "0.5.0"
description = "임의의 마크다운 코퍼스를 검색 가능한 단일 HTML 도서와 PDF(단권/병합)로 변환하고, 결과 HTML을 편집하는 범용 애플리케이션"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sungwoo Kim", email = "sungwoo.kim@gmail.com" }]
dependencies = [
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# playwright는 patch 버전 안에서도 요구하는 Chromium 빌드 리비전이 바뀔 수 있고,
# pip/pipx가 상한 없이 최신을 골라버리면(특히 pipx는 앱마다 별도 venv라
# 재설치·업그레이드 때마다 조용히 최신으로 갈아탄다) 이미 받아둔 리비전과 어긋나
# check에서 "미설치"로 보인다 — minor 단위로 못박아 재현 가능하게 고정한다.
# pdfplumber(＋전이 의존성 pdfminer.six)는 import의 컬럼/표 인식에 쓰인다
# — pypdf의 layout 모드는 y좌표 대역만으로 줄을 재구성해 컬럼 개념이 없다
# (실사용 PDF로 검증된 한계). pypdf는 build pdf의 병합(PdfWriter)에 계속 쓰여
# 둘 다 필요하다. pillow는 import의 이미지 추출(pypdf가 내부적으로
# 요구함)과 웹 에디터([editor] extra) 양쪽에서 쓰인다.
pdf = ["playwright>=1.62,<1.63", "pypdf>=4.0", "pdfplumber>=0.11.0", "pillow>=10.0"]
editor = ["flask>=3.0", "pillow>=10.0"]
# ollama는 순수 HTTP API 클라이언트라 playwright처럼 특정 바이너리 리비전에
# 묶이지 않는다 — 상한 없이 최신을 허용한다.
translate = ["ollama>=0.6.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
mdbook-binder = "mdbook_binder.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Flask API 핸들러는 어떤 예외든 JSON 에러 응답으로 바꿔 반환해야 하므로 광범위한
# except Exception이 의도적이다(요청 하나의 실패가 서버 전체를 죽이면 안 됨).
"src/mdbook_binder/editor/server.py" = ["BLE001"]
# Mermaid 렌더링 대기는 최선 노력(best-effort)이라 실패해도 조용히 다음 단계로
# 진행해야 한다 — Playwright 타임아웃은 흔한 정상 경로다.
"src/mdbook_binder/pdf_book.py" = ["BLE001", "S110", "S112", "ASYNC230"]
# Playwright/Chromium 미설치를 포함해 사전 렌더링이 실패할 수 있는 사유가
# 다양하다 — 무엇이 됐든 CDN 클라이언트 렌더링으로 조용히 폴백해야 한다.
"src/mdbook_binder/mermaid_prerender.py" = ["BLE001"]
# 이미지 추출은 선택 기능이다 — Pillow 미설치, 손상된 이미지 스트림 등
# 사유가 다양해도 텍스트 추출 자체를 막으면 안 되므로 무엇이 됐든 이미지
# 없이 계속 진행해야 한다(관대한 파싱 원칙).
"src/mdbook_binder/pdf_import.py" = ["BLE001"]
# check_environment()는 Playwright Chromium을 실제로 띄워봐야 하는데 실패
# 사유가 다양하다 — 무엇이 됐든 "미설치"로 보고하고 설치 안내를 보여줘야 한다.
"src/mdbook_binder/check.py" = ["BLE001"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# templates/ 하위 CSS/JS/편집기 SPA는 .py가 아니라 setuptools가 기본으로
# 담지 않는다 — html_book.py/pdf_book.py/editor/server.py가 런타임에 이
# 파일들을 직접 읽거나 서빙하므로 반드시 wheel/sdist에 포함해야 한다.
# templates/vendor/*(Tailwind/EasyMDE/marked/mermaid)는 CDN 대신 로컬
# 번들로 서빙해 편집기가 오프라인/CDN 차단 환경에서도 동작하게 한다.
mdbook_binder = ["templates/*", "templates/editor/*", "templates/vendor/*"]
