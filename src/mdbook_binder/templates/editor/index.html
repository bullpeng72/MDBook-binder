<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book-binder 편집기 — {{ filename }}</title>

  <!-- 전부 templates/vendor/에 로컬로 번들돼 있다(CDN 미사용) — CDN이 막힌
       네트워크(사내망/오프라인/광고차단기)에서 편집기 자체가 초기화 중간에
       멈춰버리는 문제가 있었다(EasyMDE 등이 정의되지 않아 DOMContentLoaded
       핸들러가 예외로 중단됨, 실사용 환경에서 재현·확인됨). -->

  <!-- Tailwind CSS -->
  <script src="/vendor/tailwindcss.js"></script>

  <!-- EasyMDE (+ 툴바 아이콘용 Font Awesome — editor.js의 autoDownloadFontAwesome:
       false와 짝이다. 그러지 않으면 EasyMDE가 이 링크를 이미 로드했는지
       href로 판별하지 못해 CDN에서 또 하나를 자체적으로 주입하려 든다) -->
  <link rel="stylesheet" href="/vendor/easymde.min.css">
  <link rel="stylesheet" href="/vendor/font-awesome.min.css">
  <script src="/vendor/easymde.min.js"></script>

  <!-- Marked (Markdown → HTML preview) -->
  <script src="/vendor/marked.min.js"></script>

  <!-- Mermaid (diagram preview & lightbox) -->
  <script src="/vendor/mermaid.min.js"></script>

  <!-- HTML/PDF 빌드(mermaid_prerender.py)와 동일한 폰트·줄높이로 렌더링해, 여기서
       미리 본 다이어그램의 라벨 크기가 실제 빌드 결과와 어긋나지 않게 한다. -->
  <style>{{ mermaid_font_css }}</style>

  <!-- Editor styles -->
  <link rel="stylesheet" href="/static/editor.css">

  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #f9fafb; }
    #main-layout { flex: 1; display: flex; overflow: hidden; }
    #left-panel  { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #e5e7eb; background: #fff; }
    #mid-panel   { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    #right-panel { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; border-left: 1px solid #e5e7eb; background: #fff; }
    #section-list { flex: 1; overflow-y: auto; }
    #editor-area  { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 0.75rem; gap: 0.5rem; background: #f5f7fa; }
    #editor-pane  { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    #preview-pane { flex: 1; overflow-y: auto; background: #fff; border-radius: 0.375rem; padding: 1rem 1.25rem; }
    #preview-pane h1,#preview-pane h2,#preview-pane h3,#preview-pane h4,#preview-pane h5,#preview-pane h6
      { font-weight: 700; line-height: 1.3; margin-top: 1.25em; margin-bottom: 0.4em; color: #111827; }
    #preview-pane h1 { font-size: 1.6em; }
    #preview-pane h2 { font-size: 1.35em; }
    #preview-pane h3 { font-size: 1.15em; }
    #preview-pane h4 { font-size: 1.05em; }
    #preview-pane p  { margin: 0.6em 0; line-height: 1.7; color: #374151; }
    #preview-pane ul,#preview-pane ol { margin: 0.6em 0 0.6em 1.5em; color: #374151; }
    #preview-pane ul { list-style-type: disc; }
    #preview-pane ol { list-style-type: decimal; }
    #preview-pane li { margin: 0.25em 0; line-height: 1.6; }
    #preview-pane code { background: #f3f4f6; padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.88em; font-family: monospace; color: #1f2937; }
    #preview-pane pre  { background: #f3f4f6; padding: 0.75em 1em; border-radius: 6px; overflow-x: auto; margin: 0.75em 0; }
    #preview-pane pre code { background: none; padding: 0; }
    #preview-pane blockquote { border-left: 3px solid #d1d5db; margin: 0.75em 0; padding: 0.4em 1em; color: #6b7280; }
    #preview-pane hr { border: none; border-top: 1px solid #e5e7eb; margin: 1em 0; }
    #preview-pane strong { font-weight: 700; }
    #preview-pane em { font-style: italic; }
    #preview-pane a { color: #2563eb; text-decoration: underline; }
    #visuals-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
  </style>
</head>
<body>

<!-- ================================================================ -->
<!--  Top header                                                        -->
<!-- ================================================================ -->
<header class="flex items-center gap-3 px-4 py-2 bg-white border-b border-gray-200 shadow-sm z-10">
  <span class="text-blue-600 font-bold text-sm tracking-tight">Book-binder</span>
  <span class="text-gray-300">|</span>
  <span class="text-gray-600 text-sm truncate max-w-xs" title="{{ filename }}">{{ filename }}</span>

  <div class="ml-auto flex items-center gap-2">
    <span id="save-status" class="text-xs text-gray-400"></span>
    <button id="btn-save-all"
            class="px-3 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition">
      💾 저장
    </button>
    <button id="btn-exit"
            class="px-3 py-1 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">
      종료
    </button>
  </div>
</header>

<!-- ================================================================ -->
<!--  3-panel layout                                                    -->
<!-- ================================================================ -->
<div id="main-layout">

  <!-- ============================================================== -->
  <!--  LEFT — Section list                                            -->
  <!-- ============================================================== -->
  <aside id="left-panel">
    <div class="px-3 py-2 border-b border-gray-100 bg-gray-50">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">섹션 목록</p>
    </div>
    <div id="section-list" class="text-sm">
      <div class="text-center text-gray-400 text-xs py-6">로딩 중...</div>
    </div>
  </aside>

  <!-- ============================================================== -->
  <!--  MIDDLE — Editor                                                -->
  <!-- ============================================================== -->
  <main id="mid-panel">

    <!-- Tab bar -->
    <div class="flex items-center gap-4 px-4 pt-2 pb-0 border-b border-gray-200 bg-white">
      <button id="tab-edit" class="tab-btn active pb-2 text-sm font-medium"
              onclick="switchTab('edit')">편집</button>
      <button id="tab-preview" class="tab-btn pb-2 text-sm font-medium"
              onclick="switchTab('preview')">미리보기</button>
      <span id="word-count" class="ml-auto text-xs text-gray-400 pb-2"></span>
    </div>

    <!-- Editor area -->
    <div id="editor-area">

      <!-- Empty state -->
      <div id="editor-empty" class="flex flex-col items-center justify-center flex-1 text-center">
        <p class="text-gray-400 text-sm">왼쪽에서 섹션을 선택하세요</p>
      </div>

      <!-- Section title -->
      <div id="editor-pane" class="hidden flex-col gap-2 flex-1 overflow-hidden">
        <input id="section-title-input" type="text" placeholder="섹션 제목"
               class="w-full px-2 py-1 text-sm border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">

        <!-- EasyMDE textarea -->
        <textarea id="mde-editor"></textarea>
      </div>

      <!-- Preview pane (hidden by default) -->
      <div id="preview-pane" class="hidden prose max-w-none px-2 py-1 text-sm leading-relaxed"></div>

    </div><!-- /editor-area -->

    <!-- Save section (always visible when a section is selected) -->
    <div id="save-section-bar" class="hidden flex justify-end px-4 py-2 border-t border-gray-100 bg-white">
      <button id="btn-save-section"
              class="px-3 py-1 text-xs bg-green-600 text-white rounded hover:bg-green-700 transition">
        섹션 저장 (스테이징)
      </button>
    </div>
  </main>

  <!-- ============================================================== -->
  <!--  RIGHT — Visuals (images + diagrams)                            -->
  <!-- ============================================================== -->
  <aside id="right-panel">
    <div class="px-3 py-2 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">비주얼</p>
      <button id="btn-add-image" class="hidden text-xs px-2 py-0.5 bg-blue-50 text-blue-600 border border-blue-200 rounded hover:bg-blue-100 transition"
              onclick="openAddImageModal()">+ 이미지 추가</button>
    </div>
    <div id="visuals-list">
      <div class="text-center text-gray-400 text-xs py-6">섹션을 선택하면<br>이미지/다이어그램이 표시됩니다</div>
    </div>
  </aside>

</div><!-- /main-layout -->

<!-- ================================================================ -->
<!--  Gallery / Image picker modal                                      -->
<!-- ================================================================ -->
<div id="gallery-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded-xl shadow-2xl w-[640px] max-h-[80vh] flex flex-col overflow-hidden">

    <!-- Modal header -->
    <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200">
      <h3 class="text-sm font-semibold text-gray-700">이미지 선택</h3>
      <button onclick="closeGalleryModal()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">&times;</button>
    </div>

    <!-- Gallery tabs -->
    <div class="flex gap-5 px-5 pt-2 pb-0 border-b border-gray-200">
      <button id="gtab-recommended" class="gtab-btn pb-2 text-sm"
              onclick="switchGalleryTab('recommended')">추천</button>
      <button id="gtab-gallery" class="gtab-btn pb-2 text-sm"
              onclick="switchGalleryTab('gallery')">갤러리</button>
      <button id="gtab-upload" class="gtab-btn pb-2 text-sm"
              onclick="switchGalleryTab('upload')">업로드</button>
    </div>

    <!-- Tab panes -->
    <div class="flex-1 overflow-y-auto p-4">

      <!-- Recommended -->
      <div id="gpane-recommended">
        <div id="recommended-grid" class="grid grid-cols-4 gap-2"></div>
        <div id="recommended-empty" class="hidden text-center text-gray-400 text-sm py-6">추천 이미지 없음</div>
      </div>

      <!-- Gallery -->
      <div id="gpane-gallery" class="hidden">
        <div class="flex gap-2 mb-3">
          <input id="gallery-search" type="text" placeholder="검색..."
                 class="flex-1 px-2 py-1 text-sm border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
          <button onclick="loadGallery()"
                  class="px-3 py-1 text-xs bg-gray-100 hover:bg-gray-200 rounded">검색</button>
        </div>
        <div id="gallery-grid" class="grid grid-cols-4 gap-2"></div>
        <div id="gallery-empty" class="hidden text-center text-gray-400 text-sm py-6">갤러리 비어 있음</div>
        <div id="gallery-pager" class="flex gap-1 justify-center mt-3 flex-wrap"></div>
      </div>

      <!-- Upload -->
      <div id="gpane-upload" class="hidden flex flex-col gap-3">
        <div id="upload-dropzone"
             class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-400 transition"
             onclick="document.getElementById('upload-input').click()">
          <p class="text-sm text-gray-500">클릭하거나 파일을 드래그하여 업로드</p>
          <p class="text-xs text-gray-400 mt-1">PNG · JPG · WEBP · GIF</p>
          <input id="upload-input" type="file" accept=".png,.jpg,.jpeg,.webp,.gif"
                 class="hidden" onchange="handleUpload(event)">
        </div>
        <div id="upload-preview" class="hidden flex items-center gap-3 p-2 bg-gray-50 rounded">
          <img id="upload-preview-img" src="" alt="" class="w-16 h-16 object-cover rounded">
          <span id="upload-preview-name" class="text-xs text-gray-600 truncate flex-1"></span>
        </div>
      </div>

    </div><!-- /tab panes -->

    <!-- Caption row (add mode only) -->
    <div id="caption-row" class="hidden px-5 pb-3">
      <input id="add-caption-input" type="text" placeholder="이미지 캡션 (선택)"
             class="w-full px-2 py-1 text-sm border border-gray-200 rounded focus:outline-none focus:ring-1 focus:ring-blue-400">
    </div>

    <!-- Modal footer -->
    <div class="flex justify-end gap-2 px-5 py-3 border-t border-gray-200 bg-gray-50">
      <button onclick="closeGalleryModal()"
              class="px-3 py-1 text-sm bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">취소</button>
      <button id="btn-confirm-replace" disabled
              onclick="confirmImageSelection()"
              class="px-4 py-1 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition disabled:opacity-40 disabled:cursor-not-allowed">
        선택한 이미지 교체
      </button>
    </div>

  </div>
</div><!-- /gallery-modal -->

<!-- ================================================================ -->
<!--  Lightbox                                                          -->
<!-- ================================================================ -->
<div id="lightbox"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85"
     onclick="closeLightbox(event)">
  <div class="relative flex items-center gap-3 max-w-5xl max-h-full px-4">
    <button id="lb-prev" onclick="lightboxStep(-1)"
            class="text-white text-3xl opacity-70 hover:opacity-100 select-none">&#8249;</button>
    <div class="flex flex-col items-center gap-2">
      <img id="lb-img" src="" alt="" class="max-w-[75vw] max-h-[80vh] rounded-lg shadow-2xl object-contain">
      <div class="flex items-center gap-3">
        <span id="lb-caption" class="text-white/80 text-sm"></span>
        <span id="lb-counter" class="text-white/50 text-xs"></span>
      </div>
    </div>
    <button id="lb-next" onclick="lightboxStep(1)"
            class="text-white text-3xl opacity-70 hover:opacity-100 select-none">&#8250;</button>
    <button onclick="_doCloseLightbox()"
            class="absolute top-0 right-4 text-white/60 hover:text-white text-2xl leading-none">&times;</button>
  </div>
</div>

<!-- ================================================================ -->
<!--  Diagram lightbox                                                  -->
<!-- ================================================================ -->
<div id="diagram-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85"
     onclick="closeDiagramModal(event)">
  <div class="relative bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[85vh] flex flex-col overflow-hidden mx-4">
    <div class="flex items-center justify-between px-4 py-2 border-b border-gray-200 bg-gray-50 flex-shrink-0">
      <span id="dgm-modal-title" class="text-sm font-semibold text-gray-700"></span>
      <button onclick="_doCloseDiagramModal()"
              class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>
    <div class="flex-1 overflow-auto p-6 flex items-start justify-center">
      <div id="dgm-modal-content" class="w-full"></div>
    </div>
  </div>
</div>

<!-- ================================================================ -->
<!--  Toast                                                             -->
<!-- ================================================================ -->
<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50">
  <div id="toast-inner"
       class="px-5 py-2 rounded-full text-white text-sm shadow-lg font-medium min-w-[180px] text-center">
  </div>
</div>

<!-- Editor JS -->
<script src="/static/editor.js"></script>

</body>
</html>
